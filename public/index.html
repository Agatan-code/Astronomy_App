<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <meta name="author", content="Agatan Partheeban">
        <meta name="description", content="Astronomy App">

        <link rel="stylesheet", href="style.css">

        <title>
            Astronomy App
        </title>
    
    </head>

    <body>
        

        <div id="notification_container"> 

            <div id="notification_explore" class="notification">
                <img src="photos/exclamation.png">
                <p>Explore Astronomical Objects While You Wait For Your Submission</p>
                
                <div id="close_explore" class="notification__close">
                    <img src="photos/close.png" alt="Close">
                </div>
            </div>

            <div id="notification_finished" class="notification">
                <img src="photos/exclamation.png">
                <p>Your Submission is Complete, Check the Result in the IMPORT Section</p>
                
                <div id="close_finished" class="notification__close">
                    <img src="photos/close.png" alt="Close">
                </div>
            </div>
            
        </div>

        <header class="main_title">
            <h1 class="title">THE ASTRONOMY APP</h1>
        </header>


        <div id="menu_buttons">
            <button type="button" id="display_button" class="main-buttons active" data-type="display">Display</button>
            <button type="button" id="import_button" class="main-buttons" data-type="import">Import</button>
            <button type="button" id="explore_button" class="main-buttons" data-type="explore">Explore</button>
        </div>


        <div id="display" class="display">

            <form id="showObject" class="search-bar">
                <input type="text" name="show_nameOfObject" placeholder="Search M31, NGC 224...">
                <button type="submit">Search</button>
            </form>

            <div class="filters" id="filters">
                <button class="chip active" data-type="all">All types</button>
                <button class="chip" data-type="emission_nebula">Emission nebula</button>
                <button class="chip" data-type="galaxy">Galaxies</button>
                <button class="chip" data-type="globular_cluster">Globular clusters</button>
                <button class="chip" data-type="open_cluster">Open clusters</button>
                <button class="chip" data-type="planetary_nebula">Planetary nebula</button>
                <button class="chip" data-type="other">Other</button>
            </div>

            <div class="card-grid" id="cardGrid">
                <!-- app.js will inject one .card div per object here -->
            </div>

        </div>

        <div class="modal" id="detailModal" hidden>
            <div class="modal-content" id="modalContent">
                <!-- app.js fills this in when a card is clicked -->
                <button class="close-btn" id="closeModal">Close</button>
            </div>
        </div>


        <div id="import" class="import" hidden>

            <div class="photo_import">

                <h2>Import Picture</h2>
                <div class="image">

                    <img id="photoPlaceholder" src="photo_place_holder.png" >
                    <img id="annotatedImageLink" src="" alt="Annotated Image" hidden>
                    <input id="photoInput" type="file" accept="image/jpeg, image/png, .fits, .fit">
                    <script>
                        const photoInput = document.getElementById('photoInput');
                        const photoPlaceholder = document.getElementById('photoPlaceholder');

                        photoInput.addEventListener('change', function() {
                            const file = this.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = function(e) {
                                    photoPlaceholder.src = e.target.result;
                                }
                                reader.readAsDataURL(file);
                            }
                        });
                    </script>

                    <button type="submit" id="user_input_submit" class="submit_button">Submit</button>
                    <script>
                        const user_input_button = document.getElementById("user_input_submit")

                        user_input_button.addEventListener('click', function() {
                            user_input_button.classList.add("clicked");
                            setTimeout(function() {
                                user_input_button.classList.remove("clicked");
                            }, 225)
                        });
                    </script>
                    
                </div>

            </div>
        </div>

        <div id="explore" class="explore" hidden>

            <br>
            <div class="filters" id="options">
                <button class="chip active" data-type="milky_way">Milky Way Galaxy</button>
                <button class="chip" data-type="solar_system">Solar System</button>
                <button class="chip" data-type="asteroids">Asteroids</button>
                <button class="chip" data-type="mars">Mars</button>
                <button class="chip" data-type="earth">Earth</button>
                <button class="chip" data-type="dsn">Deep Space Network</button>
            </div>

            <div class="explore-display-wrapper">
                <iframe id="explore_option_display" class="explore_display" src="https://eyes.nasa.gov/apps/exo/" title="explore_option"></iframe>
            </div>

        </div>


        <script src="app.js"></script>
        
    </body>

</html>
